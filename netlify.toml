[build]
  publish = "static"
  functions = "netlify/functions"

[functions]
  python_version = "3.12"

# make sure the shared numpy implementation travels with the function bundle
[[functions]]
  function = "run"
  included_files = ["transformer.py"]

# the front end calls /api/run; forward it to the function
[[redirects]]
  from = "/api/run"
  to = "/.netlify/functions/run"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/run"
  status = 200
